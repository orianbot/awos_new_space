<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>AWOS 農場 | 米其林式的質樸農村體驗</title>
    <link rel="stylesheet" href="css/design-tokens.css">
</head>
<body>
    <div id="header-placeholder"></div>
    
    <main id="main">
        <div id="hero-placeholder"></div>
        <div id="story-placeholder"></div>
        <div id="products-placeholder"></div>
        <div id="tour-placeholder"></div>
        <div id="team-placeholder"></div>
        <div id="cta-placeholder"></div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        // 載入組件
        const loadComponent = (id, path) => {
            fetch(path)
                .then(r => r.text())
                .then(d => {
                    document.getElementById(id).innerHTML = d;
                    // 初始化選單互動
                    if(id === 'header-placeholder') initMenu();
                });
        };

        const initMenu = () => {
            const trigger = document.getElementById('menu-trigger');
            const menu = document.getElementById('full-menu');
            const close = document.getElementById('close-menu');
            
            trigger.addEventListener('click', () => {
                menu.style.display = 'flex';
                setTimeout(() => menu.style.opacity = '1', 10);
            });
            close.addEventListener('click', () => {
                menu.style.opacity = '0';
                setTimeout(() => menu.style.display = 'none', 500);
            });
        };

        loadComponent('header-placeholder', 'components/header.html');
        loadComponent('hero-placeholder', 'sections/hero.html');
        loadComponent('story-placeholder', 'sections/story.html');
        loadComponent('products-placeholder', 'sections/products.html');
        loadComponent('tour-placeholder', 'sections/tour.html');
        loadComponent('team-placeholder', 'sections/team.html');
        loadComponent('cta-placeholder', 'sections/cta.html');
        loadComponent('footer-placeholder', 'components/footer.html');
    </script>
</body>
</html>
