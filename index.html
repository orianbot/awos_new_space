<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>AWOS 農場</title>
    <link rel="stylesheet" href="css/design-tokens.css">
</head>
<body>
    <div id="header-placeholder"></div>
    
    <main id="main">
        <div id="hero-placeholder"></div>
        <div id="story-placeholder"></div>
        <div id="products-placeholder"></div>
        <div id="tour-placeholder"></div>
        <div id="team-placeholder"></div>
        <div id="cta-placeholder"></div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        // 模擬元件載入 (實際開發可用 AJAX 或框架元件化)
        fetch('components/header.html').then(r => r.text()).then(d => document.getElementById('header-placeholder').innerHTML = d);
        fetch('sections/hero.html').then(r => r.text()).then(d => document.getElementById('hero-placeholder').innerHTML = d);
        fetch('sections/story.html').then(r => r.text()).then(d => document.getElementById('story-placeholder').innerHTML = d);
        fetch('sections/products.html').then(r => r.text()).then(d => document.getElementById('products-placeholder').innerHTML = d);
        fetch('sections/tour.html').then(r => r.text()).then(d => document.getElementById('tour-placeholder').innerHTML = d);
        fetch('sections/team.html').then(r => r.text()).then(d => document.getElementById('team-placeholder').innerHTML = d);
        fetch('sections/cta.html').then(r => r.text()).then(d => document.getElementById('cta-placeholder').innerHTML = d);
        fetch('components/footer.html').then(r => r.text()).then(d => document.getElementById('footer-placeholder').innerHTML = d);
    </script>
</body>
</html>
